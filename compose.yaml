name: pitflow
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pitflow
      POSTGRES_USER: ${DB_USERNAME:-pitflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Create .env using scripts/setup.ps1 or setup.sh}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d pitflow"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/pitflow
      DB_USERNAME: ${DB_USERNAME:-pitflow}
      DB_PASSWORD: ${DB_PASSWORD:?Create .env first}
      PITFLOW_ADMIN_EMAIL: ${PITFLOW_ADMIN_EMAIL:-}
      PITFLOW_ADMIN_PASSWORD: ${PITFLOW_ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      TOSS_API_BASE_URL: ${TOSS_API_BASE_URL:-https://api.tosspayments.com}
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://backend:8080
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  postgres_data:
