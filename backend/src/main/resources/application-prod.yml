server:
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:true}
  tomcat:
    threads:
      max: ${SERVER_MAX_THREADS:24}
      min-spare: ${SERVER_MIN_SPARE_THREADS:2}
    accept-count: ${SERVER_ACCEPT_COUNT:32}
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:4}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:20000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:60000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:600000}
pitflow:
  bootstrap:
    admin-email: ${PITFLOW_ADMIN_EMAIL}
    admin-password: ${PITFLOW_ADMIN_PASSWORD}
